{% extends 'base.html' %}

{% block title %}Student Login{% endblock %}

{% block content %}
<div class="login-box">
    <div class="heading">
        <h2>Student Login</h2>
        <p>Login to access your dashboard and apply for jobs</p>
    </div>

    <form method="POST" action="{{ url_for('student_login') }}">
        <div class="mb-3">
            <label for="email" class="form-label">Student Email ID</label>
            <input type="text" id="email" name="email" class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control">
        </div>

        <div class="d-grid mt-3">
            <input type="submit" value="Login" class="btn btn-primary">
        </div>
    </form>

    <p class="text-center mt-3 mb-0">
        Don't have an account?
        <a href="{{ url_for('student_register') }}">Register</a>
    </p>
</div>
{% endblock %}
