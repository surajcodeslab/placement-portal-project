{% extends "base.html" %}
{% block title %}Student Profile{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2>Student Profile</h2>
        <p>This is where students can view their profile information and make updates.</p>
    </div>
    <div class="container mt-4 mb-4">
        <div class="custom-box">
             <h3>Profile Information</h3>
             <form method="POST">
              <div class="mb-3">
                <label for="name" class="form-label"><strong>Name</strong></label>
                <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label"><strong>Email</strong></label>
                <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
            </div>

            <div class="mb-3">
                <label for="age" class="form-label"><strong>Age</strong></label>
                <input type="number" class="form-control" id="age" name="age" value="{{ student.age }}" required>
            </div>

            <div class="mb-3">
                <label for="gender" class="form-label"><strong>Gender</strong></label>
                <select class="form-select" id="gender" name="gender" required>
                    <option value="Male" {% if student.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == "Female" %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender == "Other" %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label"><strong>Phone</strong></label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone }}" required>
            </div>

            <div class="mb-3">
                <label for="degree" class="form-label"><strong>Degree</strong></label>
                <input type="text" class="form-control" id="degree" name="degree" value="{{ student.degree or '' }}">
            </div>

            <div class="mb-3">
                <label for="skills" class="form-label"><strong>Skills</strong></label>
                <textarea class="form-control" id="skills" name="skills" rows="3">{{ student.skills or '' }}</textarea>
            </div>

            <div class="mb-3">
                <label for="curriculum_vitae" class="form-label"><strong>Curriculum Vitae Link</strong></label>
                <input type="url" class="form-control" id="curriculum_vitae" name="curriculum_vitae" value="{{ student.curriculum_vitae }}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Update Profile</button>
                <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
            </form>
        </div>
{% endblock %}
